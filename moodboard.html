<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alur Moodboard Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=Gilda+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4f2;--card:#fff;--ink:#2d2225;--mut:#85727a;--line:#ead9dc;--acc:#b4566b;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=sage]{--bg:#f0f3ed;--card:#fff;--ink:#222b25;--mut:#6c7a70;--line:#dbe3d8;--acc:#4f7a62}
:root[data-t=emas]{--bg:#f6f0e2;--card:#fffdf7;--ink:#2b2418;--mut:#7d7258;--line:#e5dac0;--acc:#8f6a1c}
:root[data-t=malam]{--bg:#17151d;--card:#211f2a;--ink:#f0ebe6;--mut:#a39cab;--line:#38354a;--acc:#d9b26a;--accfg:#1b1608}
@media (prefers-color-scheme:dark){:root:not([data-t]){--bg:#17151d;--card:#211f2a;--ink:#f0ebe6;--mut:#a39cab;--line:#38354a;--acc:#d9b26a;--accfg:#1b1608}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:7px 14px 5px}
.r1{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#ttl{flex:1 1 220px;min-width:0;font:400 26px "Gilda Display",serif;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0}
#ttl::placeholder{color:var(--mut)}
.seg,.thm{display:flex;gap:4px;align-items:center}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--mut)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
.sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
#sv{font-size:12px;color:var(--mut)}
#step{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
#step button{white-space:nowrap}
#step button small{opacity:.7;margin-left:4px}
#step button.cur{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
main{max-width:1000px;margin:0 auto;padding:14px 14px 50px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:center}
.hd h2{font:400 20px/1.1 "Gilda Display",serif;margin:0 0 2px;color:var(--acc)}
.hd p{margin:0;color:var(--mut);max-width:100%;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal{display:flex;gap:3px;flex-shrink:0}
.tt{flex:1;min-width:0}
.gh{border:0;background:transparent;padding:0 4px;font-size:22px;line-height:1;cursor:grab;touch-action:none;color:var(--mut)}
.gh:active{cursor:grabbing}
.card.mv{position:relative;z-index:5;opacity:.92;box-shadow:0 14px 34px rgba(0,0,0,.28);user-select:none;-webkit-user-select:none}
.card.ov-t{box-shadow:0 -4px 0 var(--acc)}.card.ov-b{box-shadow:0 4px 0 var(--acc)}
.tipb{position:relative;width:24px;height:24px;padding:0;border-radius:50%;font-size:13px;color:var(--mut)}
.tipb::after{content:attr(data-tip);position:absolute;left:0;top:30px;width:max-content;max-width:min(240px,70vw);background:var(--ink);color:var(--card);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:400;line-height:1.4;text-align:left;white-space:normal;z-index:40;display:none}
.tipb:hover::after,.tipb:focus-visible::after,.tipb.open::after{display:block}
@media (max-width:640px){
 html{scroll-padding-top:112px}
 body{font-size:14px}
 .top{padding:5px 10px 3px}
 .r1{gap:6px}
 #ttl{flex:1 1 100%;font-size:19px}
 .seg button,#expAll{padding:3px 9px;font-size:12px}
 .sw{width:18px;height:18px}
 #sv{font-size:10px}
 #step{padding:5px 0 1px;gap:4px}
 #step button{padding:3px 9px;font-size:12px}
 main{padding:8px 8px 40px;gap:10px}
 .card{padding:8px;border-radius:12px}
 .hd h2{font-size:17px}.hd p{display:none}
 .pal i{width:8px;height:8px}
 .col{margin:8px 0}
 .tl{gap:4px}.tl .btn,.tl button:not(.tipb){padding:3px 9px;font-size:12px}
 .pc button,.pa button{padding:1px 6px;font-size:12px}
 .chip{font-size:12px;padding:3px 9px}
 .add,.nt{font-size:13px;padding:6px 8px}
 .more>summary{font-size:12px}
}.pal i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line)}
.more>summary,.tip>summary{cursor:pointer;font-size:13px;color:var(--mut);margin-top:8px}.tip>summary{font-size:12px}.more[open]>summary{margin-bottom:2px}
.col{position:relative;border-radius:12px;background:var(--bg);min-height:150px;margin:14px 0}
.ph{position:absolute;overflow:hidden;border-radius:8px;cursor:grab}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.free .ph{touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.rz{position:absolute;right:5px;bottom:5px;width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid #fff;cursor:nwse-resize;display:none}
.ph.on .rz{display:block}
.ph{background:var(--card)}
.pa{position:absolute;inset:auto 0 0 0;display:none;gap:4px;justify-content:center;flex-wrap:wrap;padding:18px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:3}
.pa button{padding:1px 9px;font-size:13px}
.ph.adj .pa{display:flex}.ph.adj .pc{display:none!important}
.ph.adj{touch-action:none;cursor:move;outline:2px solid var(--acc);outline-offset:-2px}
.rs{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;display:none;z-index:4;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%)}
.ph.on .rs{display:block}.ph.adj .rs{display:none!important}
.pc{position:absolute;inset:auto 0 0 0;display:none;flex-wrap:wrap;gap:4px;justify-content:center;padding:18px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ph:hover .pc,.ph.on .pc{display:flex}
.pc button{padding:1px 9px;font-size:13px}
.em{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:12px;padding:12px;pointer-events:none}
.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tl .sp{flex:1}
h3{font-size:13px;margin:10px 0 6px}h3 small{color:var(--mut);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 11px}
.add,.nt{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.nt{min-height:64px;resize:vertical;margin-top:14px}
.foot{display:flex;gap:8px;flex-wrap:wrap}.foot input{flex:1 1 200px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:50;overflow:auto;padding:16px;text-align:center}
#ov.on{display:block}#ov img{max-width:min(100%,900px);border-radius:8px;background:#fff}
#ov p{color:#fff;margin:10px auto;max-width:460px;font-size:14px}
</style>
</head>
<body>

<script>

const PRE={

{n:'Outdoor golden hour',d:'Foto luar ruangan saat cahaya hangat sore: alami, bergerak, dan penuh tawa.',p:['#f2b880','#e8896a','#7a8f6d','#fff3e0'],s:['Berjalan bergandengan di jalan setapak','Siluet saat matahari terbenam','Berlari kecil dan tawa lepas','Pelukan dari belakang','Duduk santai di padang atau pantai','Kain atau veil tertiup angin','Half-body saling menatap','Potret solo masing-masing']},
{n:'Studio atau indoor',d:'Pose lebih terarah dengan cahaya lembut: klasik, elegan, dan fokus pada ekspresi.',p:['#d9d2cc','#8a7f78','#2b2a2e','#ffffff'],s:['Berdiri klasik dan duduk di kursi','Dahi menempel dan mata terpejam','Close-up tangan dan cincin','Dansa pelan berdua','Siluet backlight','Potret formal full-body']},
{n:'Candid dan detail',d:'Momen spontan dan detail kecil yang membuat cerita kalian terasa personal.',p:['#f1e3d3','#c58b6f','#8fa3ad','#ffffff'],s:['Tawa spontan','Aktivitas favorit berdua','Cium kening','Detail tangan dan kaki','Bersama hewan peliharaan atau props personal','Foto untuk save the date']}]}
};
const THEMES={blush:'#b4566b',sage:'#4f7a62',emas:'#8f6a1c',malam:'#d9b26a'};
let uid=0,S=null,active=0,drag=null,tm;
const mk=src=>{const i=new Image();i.onload=()=>{try{P().st.forEach(layCol)}catch(e){}};i.src=src;return i};
const mkSt=p=>({id:++uid,n:p.n,d:p.d,p:p.p,sh:p.s.map(t=>({t,d:0})),ph:[],mode:'mosaik',note:''});
const fresh=()=>({t:'nikah',th:'',P:{}});
try{S=JSON.parse(localStorage.getItem('wmb2')||'null');if(S)Object.values(S.P).forEach(p=>p.st.forEach(s=>{uid=Math.max(uid,s.id);if(s.mode==='bebas')s.mode='mosaik';s.ph.forEach(h=>h.im=mk(h.src))}))}catch(e){S=null}
if(!S)S=fresh();Object.keys(PRE).forEach(k=>{if(!S.P[k])S.P[k]={title:'',st:PRE[k].st.map(mkSt)}});
const P=()=>S.P[S.t],getS=id=>P().st.find(s=>s.id===id);

function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('wmb2',JSON.stringify(S,(k,v)=>k==='im'?undefined:v));$('#sv').textContent='Tersimpan'}catch(e){$('#sv').textContent='Penyimpanan penuh, ekspor dulu'}},400)}
function commit(){const y=scrollY;render();scrollTo(0,y);save()}

function lay(n,mode,W,ph){
  const g=8,r=[];if(!n)return{r,H:0};
  if(mode==='bebas'){let m=0;ph.forEach(h=>{const w=h.fw*W,hh=w*(h.ratio||1.25);r.push({x:h.fx*W,y:h.fy*W,w,h:hh,rot:h.rot||0});m=Math.max(m,h.fy*W+hh)});return{r,H:Math.max(.55*W,m+.04*W)}}
  {const c=ph.c||3,cw=(W-g*(c-1))/c,ch=cw*(ph.cr||1.25);let m=0;ph.forEach(p=>{const gx=p.gx||0,gy=p.gy||0,cs=p.cs||1,rs=p.rs||1;r.push({x:gx*(cw+g),y:gy*(ch+g),w:cs*cw+(cs-1)*g,h:rs*ch+(rs-1)*g});m=Math.max(m,gy+rs)});return{r,H:m*(ch+g)-g,cw,ch,c}}
  if(0){const big=mode==='mosaik'&&n>=3,c=big?(W>620?4:3):(n===1?1:n<=4?2:3),cw=(W-g*(c-1))/c,ch=big?cw:cw*(c===1?.62:1.25),occ={};let m=0;
    for(let i=0;i<n;i++){const p=ph[i],cs=Math.min(c,p.cs||(big&&i===0?2:1)),rs=Math.min(6,p.rs||(big&&i===0?2:1));let x=0,y=0;
      out:for(y=0;;y++){for(x=0;x+cs<=c;x++){let ok=1;for(let a=0;a<rs&&ok;a++)for(let b=0;b<cs;b++)if(occ[(y+a)+','+(x+b)]){ok=0;break}if(ok)break out}}
      for(let a=0;a<rs;a++)for(let b=0;b<cs;b++)occ[(y+a)+','+(x+b)]=1;
      r.push({x:x*(cw+g),y:y*(ch+g),w:cs*cw+(cs-1)*g,h:rs*ch+(rs-1)*g});m=Math.max(m,y+rs)}
    return{r,H:m*(ch+g)-g,cw,ch,c}}
  if(0){
    const c=W>620?4:3,cw=(W-g*(c-1))/c,occ={};let m=0;
    const put=(x,y,w,h)=>{for(let a=0;a<h;a++)for(let b=0;b<w;b++)occ[(y+a)+','+(x+b)]=1;r.push({x:x*(cw+g),y:y*(cw+g),w:w*cw+g*(w-1),h:h*cw+g*(h-1)});m=Math.max(m,y+h)};
    put(0,0,2,2);
    for(let i=1;i<n;i++){let x=0,y=0;out:for(y=0;;y++){for(x=0;x<c;x++){if(!occ[y+','+x])break out}}put(x,y,1,1)}
    return{r,H:m*(cw+g)-g};
  }
  const c=n===1?1:n<=4?2:3,cw=(W-g*(c-1))/c,ch=cw*(c===1?.62:1.25);
  for(let i=0;i<n;i++)r.push({x:(i%c)*(cw+g),y:Math.floor(i/c)*(ch+g),w:cw,h:ch});
  return{r,H:Math.ceil(n/c)*(ch+g)-g};
}
function place(w,h,p){const ra=p.ratio||1.25,s0=Math.max(w,h/ra),zmin=Math.min(w,h/ra)/s0,z=p.fit?zmin:Math.min(4,Math.max(zmin,p.zm||1)),dw=s0*z,dh=s0*ra*z;return{dw,dh,l:(w-dw)*(p.ox??.5),t:(h-dh)*(p.oy??.5),z,zmin}}
function fitImg(im,w,h,p){const q=place(w,h,p);Object.assign(im.style,{position:'absolute',left:q.l+'px',top:q.t+'px',width:q.dw+'px',height:q.dh+'px',objectFit:'fill'})}
function ensN(s,W){
  if(s.mode==='bebas')return;
  if(!s.c)s.c=W>620?4:3;
  s.cr=s.mode==='mosaik'?1:1.25;
  if(s.ph.some(h=>h.gx==null)){
    const occ={};s.ph.forEach(h=>{if(h.gx!=null)for(let a=0;a<h.rs;a++)for(let b=0;b<h.cs;b++)occ[(h.gy+a)+','+(h.gx+b)]=1});
    s.ph.forEach((h,i)=>{if(h.gx!=null)return;const big=s.mode==='mosaik'&&i===0,cs=Math.min(s.c,h.cs||(big?2:1)),rs=h.rs||(big?2:1);let x=0,y=0;
      out:for(y=0;;y++){for(x=0;x+cs<=s.c;x++){let ok=1;for(let a=0;a<rs&&ok;a++)for(let b=0;b<cs;b++)if(occ[(y+a)+','+(x+b)]){ok=0;break}if(ok)break out}}
      for(let a=0;a<rs;a++)for(let b=0;b<cs;b++)occ[(y+a)+','+(x+b)]=1;h.gx=x;h.gy=y;h.cs=cs;h.rs=rs})}
  s.ph.c=s.c;s.ph.cr=s.cr;
}
function ens(s,W){ensN(s,W||900);s.ph.forEach((h,i)=>{if(!h.ratio&&h.im.naturalWidth)h.ratio=h.im.naturalHeight/h.im.naturalWidth;if(s.mode==='bebas'&&h.fw==null){h.fw=.28;h.fx=.03+(i%3)*.325;h.fy=.03+Math.floor(i/3)*.42;h.z=i+1;h.rot=0}})}
function layCol(s){
  const el=document.querySelector('.col[data-sid="'+s.id+'"]');if(!el)return;
  ens(s,el.clientWidth);const{r,H}=lay(s.ph.length,s.mode,el.clientWidth,s.ph);el.style.height=(H||170)+'px';el.innerHTML='';el.className='col'+(s.mode==='bebas'?' free':'');
  if(!s.ph.length){el.innerHTML='<div class="em">Seret, tempel, atau tambah foto</div>';return}
  s.ph.forEach((h,i)=>{
